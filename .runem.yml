- import: .config/runem/hooks/on_exit/log_times/runem.yml
- import: .config/runem/jobs/md/runem.yml
- import: .config/runem/jobs/json/runem.yml
- import: .config/runem/jobs/node_js/runem.yml
- import: .config/runem/jobs/python/runem.yml
- import: .config/runem/jobs/dog_food/runem.yml
- config:
    phases:
      - pre-run
      - edit
      - analysis
    files:
      - filter:
          tag: yarn-deps
          regex: "package.json"
      - filter:
          tag: py
          regex: ".*\\.py$"
      - filter:
          tag: json
          regex: ".*\\.(json)$"
      - filter:
          tag: markdown
          regex: ".*\\.(md|mdx|mdc)$"
      - filter:
          tag: spell
          regex: ".*\\.(py|yml|json)$"
    options:
      - option:
          default: true
          name: black
          type: bool
          desc: allow/disallows py-black from running
      - option:
          alias: check
          default: false
          name: check-only
          type: bool
          desc: runs in check-mode, erroring if isort, black or any text-edits would occur
      - option:
          default: true
          desc: generates coverage reports for whatever can generate coverage info when added
          name: coverage
          type: bool
      - option:
          default: true
          name: fix
          desc: try to auto fix whenever possible
          type: bool
      - option:
          default: true
          desc: formats docs and comments in whatever job can do so
          name: docformatter
          type: bool
      - option:
          default: false
          name: install-deps
          type: bool
          desc: gets dep-installing job to run
      - option:
          default: true
          name: isort
          type: bool
          desc: allow/disallows isort from running on python files
      - option:
          default: true
          name: ruff
          type: bool
          desc: prefer running formatting with ruff instead of isort, black and docformatter
      - option:
          default: true
          name: unit-test
          desc: run unit tests
          type: bool
